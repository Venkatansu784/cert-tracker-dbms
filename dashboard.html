<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Record - HR Compliance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-shield-alt" style="color: var(--primary);"></i> CertTrack
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="employee-forms.html" class="nav-item active"><i class="fas fa-user-plus"></i> Add Record</a>
            <a href="index.html" class="nav-item" style="margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <div style="font-weight: 500; color: var(--text-muted);">Database / Insert Record</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600;">HR</div>
            </div>
        </header>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1 style="font-size: 1.75rem; margin-bottom: 8px;">Register Certification</h1>
                    <p style="color: var(--text-muted);">Fill out the form below to append a new compliance record.</p>
                </div>
            </div>

            <div class="card">
                <form id="recordForm">
                    <h3 style="margin-bottom: 20px; font-size: 1.1rem; color: var(--text-main);">Employee Information</h3>
                    <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                        <div class="form-group">
                            <label>Employee ID *</label>
                            <input type="text" id="empId" required placeholder="e.g. EMP101">
                        </div>
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="empName" required placeholder="e.g. John Doe">
                        </div>
                        <div class="form-group">
                            <label>Department *</label>
                            <select id="empDept" required>
                                <option value="AI & Machine Learning">AI & Machine Learning</option>
                                <option value="Software Engineering">Software Engineering</option>
                                <option value="Cyber Security">Cyber Security</option>
                                <option value="Human Resources">Human Resources</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Office Location *</label>
                            <select id="empLoc" required>
                                <option value="HITEC City Campus">HITEC City Campus</option>
                                <option value="Gachibowli Phase 2">Gachibowli Phase 2</option>
                                <option value="Financial District">Financial District</option>
                            </select>
                        </div>
                    </div>

                    <hr style="border: none; border-top: 1px solid var(--border); margin: 24px 0;">

                    <h3 style="margin-bottom: 20px; font-size: 1.1rem; color: var(--text-main);">Certification Details</h3>
                    <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Certification Name *</label>
                            <input type="text" id="certName" required placeholder="e.g. AWS Certified Solutions Architect">
                        </div>
                        <div class="form-group">
                            <label>Issue Date *</label>
                            <input type="date" id="issueDate" required>
                        </div>
                        <div class="form-group">
                            <label>Expiry Date *</label>
                            <input type="date" id="expiryDate" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Save to Database
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
